[project]
name = "aftercare-application"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
 "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary,pool]>=3.2,<4",
 "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4", "langgraph-checkpoint-sqlite>=3,<4", "langchain-openai>=1,<2",
 "pgvector>=0.3,<1", "jieba>=0.42,<1", "sentence-transformers>=3,<6",
 "torch==2.15.0",
 "boto3>=1.35,<2", "Pillow>=11,<13", "python-multipart>=0.0.20,<1",
 "celery[redis]>=5.4,<6", "httpx>=0.28,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/aftercare"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "../scripts"]
markers = ["pg: needs isolated aftercare PostgreSQL"]
[tool.ruff]
line-length = 100
