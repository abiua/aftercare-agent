name: aftercare-customer-search
services:
  metadata:
    image: quay.io/coreos/etcd:v3.5.23
    entrypoint: /usr/local/bin/etcd
    command:
      - --name=default
      - --data-dir=/var/lib/milvus/etcd
      - --listen-client-urls=http://127.0.0.1:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --quota-backend-bytes=4294967296
    volumes: [catalog:/var/lib/milvus]
    ports: ["127.0.0.1:19538:19530"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 4s
      retries: 20
  search:
    image: milvusdb/milvus:v2.6.9
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    network_mode: service:metadata
    depends_on:
      metadata:
        condition: service_healthy
    volumes: [catalog:/var/lib/milvus]
    environment:
      ETCD_USE_EMBED: "false"
      ETCD_ENDPOINTS: 127.0.0.1:2379
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
      MQ_TYPE: rocksmq
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/healthz"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  catalog:
    external: true
    name: tau-rag-p3_milvus
