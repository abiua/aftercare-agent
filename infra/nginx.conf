server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API enforces an 8 MiB file limit; allow 64 KiB for multipart metadata.
    client_max_body_size 8519680;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $aftercare_api ${AFTERCARE_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;

    location /api/ {
        proxy_pass http://$aftercare_api;
        gzip off;
    }

    # JSON string escaping can nearly double an 8 MiB report. The backend
    # checks the original UTF-8 report bytes and the request envelope.
    location = /api/evaluation/imports {
        client_max_body_size 17m;
        proxy_pass http://$aftercare_api;
        gzip off;
    }
}
