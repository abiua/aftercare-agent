name: aftercare-v2
services:
  pg-app:
    image: pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    profiles: [app]
    env_file: ../.runtime/pg-app.env
    command: [postgres, -c, cluster_name=aftercare-v2-app]
    ports: ['127.0.0.1:55450:5432']
    volumes: ['pg-app:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ac_app -d ac_app']
      interval: 2s
      timeout: 3s
      retries: 30
  pg-test:
    image: pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    profiles: [test]
    env_file: ../.runtime/pg-test.env
    # Isolated evaluation schemas are included in consistent backup snapshots.
    # Their tables and indexes exceed PostgreSQL's default lock-table capacity.
    command: [postgres, -c, cluster_name=aftercare-v2-test, -c, max_locks_per_transaction=512]
    ports: ['127.0.0.1:55451:5432']
    volumes: ['pg-test:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ac_test -d ac_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis-app:
    image: redis@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    profiles: [app]
    ports: ['127.0.0.1:56379:6379']
    command: [redis-server, --appendonly, 'yes']
    volumes: ['redis-app:/data']
  redis-test:
    image: redis@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    profiles: [test]
    ports: ['127.0.0.1:56380:6379']
    command: [redis-server, --appendonly, 'yes']
    volumes: ['redis-test:/data']
  objects-app:
    image: chrislusf/seaweedfs@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    profiles: [app]
    command: [server, -dir=/data, -ip=objects-app, -ip.bind=0.0.0.0, -s3, -s3.port=8333, -s3.config=/config/s3.json]
    ports: ['127.0.0.1:58350:8333']
    volumes: ['objects-app:/data', '../.runtime/s3-app.json:/config/s3.json:ro']
  objects-test:
    image: chrislusf/seaweedfs@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    profiles: [test]
    command: [server, -dir=/data, -ip=objects-test, -ip.bind=0.0.0.0, -s3, -s3.port=8333, -s3.config=/config/s3.json]
    ports: ['127.0.0.1:58351:8333']
    volumes: ['objects-test:/data', '../.runtime/s3-test.json:/config/s3.json:ro']
volumes:
  pg-app:
  pg-test:
  redis-app:
  redis-test:
  objects-app:
  objects-test:
